<line x1="470" y1="335" x2="478" y2="335" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="518" y1="335" x2="526" y2="335" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="566" y1="335" x2="574" y2="335" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>

<text x="450" y="376" font-size="12" fill="#5f5e5a" text-anchor="middle">t1</text>
<text x="498" y="376" font-size="12" fill="#5f5e5a" text-anchor="middle">t2</text>
