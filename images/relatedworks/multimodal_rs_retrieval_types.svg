<polygon points="489,344 500,322 512,330 505,349 492,346" fill="#7FA84A"/>
<line x1="481" y1="352" x2="515" y2="318" stroke="#9c9a92" stroke-width="0.75"/>
<rect x="526" y="308" width="40" height="55" rx="4" fill="#DED1AE" stroke="#8a8a86" stroke-width="0.5"/>
<polygon points="534,347 548,320 562,329 552,352 538,349" fill="#7FA84A"/>
<line x1="529" y1="352" x2="563" y2="318" stroke="#9c9a92" stroke-width="0.75"/>
<rect x="574" y="308" width="40" height="55" rx="4" fill="#DED1AE" stroke="#8a8a86" stroke-width="0.5"/>
<polygon points="580,349 596,318 612,328 600,354 584,351" fill="#7FA84A"/>
