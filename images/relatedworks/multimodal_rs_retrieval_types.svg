<polygon points="509,218 533,199 551,213 536,235 512,232" fill="#7FA84A"/>
<line x1="503" y1="237" x2="557" y2="194" stroke="#9c9a92" stroke-width="0.75"/>
<rect x="570" y="188" width="60" height="55" rx="4" fill="#DED1AE" stroke="#8a8a86" stroke-width="0.5"/>
<polygon points="579,218 603,199 621,213 606,235 582,232" fill="#7FA84A"/>
<line x1="573" y1="237" x2="627" y2="194" stroke="#9c9a92" stroke-width="0.75"/>
<text x="530" y="259" font-size="12" fill="#5f5e5a" text-anchor="middle">Retrieved images</text>

<!-- ============ ROW 3 OUTPUT: retrieved image time series (t1 -> t4) ============ -->
<rect x="430" y="308" width="40" height="55" rx="4" fill="#DED1AE" stroke="#8a8a86" stroke-width="0.5"/>
<polygon points="444,340 452,326 460,332 456,344 446,342" fill="#7FA84A"/>
<line x1="433" y1="352" x2="467" y2="318" stroke="#9c9a92" stroke-width="0.75"/>
