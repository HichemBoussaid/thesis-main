<polygon points="509,98 533,79 551,93 536,115 512,112" fill="#7FA84A"/>
<line x1="503" y1="117" x2="557" y2="74" stroke="#9c9a92" stroke-width="0.75"/>
<rect x="570" y="68" width="60" height="55" rx="4" fill="#DED1AE" stroke="#8a8a86" stroke-width="0.5"/>
<polygon points="579,98 603,79 621,93 606,115 582,112" fill="#7FA84A"/>
<line x1="573" y1="117" x2="627" y2="74" stroke="#9c9a92" stroke-width="0.75"/>
<text x="530" y="139" font-size="12" fill="#5f5e5a" text-anchor="middle">Retrieved images</text>

<!-- ============ ROW 2 OUTPUT: retrieved images ============ -->
<rect x="430" y="188" width="60" height="55" rx="4" fill="#DED1AE" stroke="#8a8a86" stroke-width="0.5"/>
<polygon points="439,218 463,199 481,213 466,235 442,232" fill="#7FA84A"/>
<line x1="433" y1="237" x2="487" y2="194" stroke="#9c9a92" stroke-width="0.75"/>
