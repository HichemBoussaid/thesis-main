<svg width="680" height="490" viewBox="0 0 680 490" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>QUEST architecture, AnySat-inspired</title>
<desc>Each of three visual modalities (VHR, multispectral, SAR) and text is encoded into patch tokens, fused by a central fusion module, then routed to per-modality reconstruction decoders and a shared generative decoder for captioning and VQA. Reconstruction loss spans encoder tokens to decoder outputs; contrastive loss connects token embeddings across all four modalities; generation loss applies to the shared decoder.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="490" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif">

<!-- top loss: reconstruction -->
<line x1="200" y1="40" x2="531" y2="40" stroke="#A32D2D" stroke-width="1" marker-end="url(#arrow-red)"/>
<line x1="200" y1="40" x2="200" y2="65" stroke="#A32D2D" stroke-width="1"/>
<line x1="531" y1="40" x2="531" y2="65" stroke="#A32D2D" stroke-width="1"/>
<text x="365" y="28" text-anchor="middle" font-size="14" font-weight="500" fill="#791F1F">L reconstruction</text>

<!-- legend -->
<rect x="545" y="65" width="10" height="10" rx="2" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="561" y="74" font-size="12" fill="#5F5E5A">= masked token</text>

<!-- Row 1: VHR -->
<text x="40" y="115" font-size="14" font-weight="500" fill="#2C2C2A">VHR</text>
<rect x="95" y="92" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<polygon points="140,73 140,147 190,110" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="200" y="89" width="12" height="12" rx="2" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="200" y="104" width="12" height="12" rx="2" fill="#2C2C2A" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="200" y="119" width="12" height="12" rx="2" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<line x1="212" y1="110" x2="275" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="365" y1="110" x2="400" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="400" y="89" width="12" height="12" rx="2" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="400" y="104" width="12" height="12" rx="2" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="400" y="119" width="12" height="12" rx="2" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<line x1="412" y1="110" x2="428" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<polygon points="430,110 480,73 480,147" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<line x1="480" y1="110" x2="493" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="495" y="92" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>

<!-- Row 2: MS -->
<text x="40" y="215" font-size="14" font-weight="500" fill="#2C2C2A">MS</text>
<rect x="95" y="192" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<polygon points="140,173 140,247 190,210" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
