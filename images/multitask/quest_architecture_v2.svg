<rect x="400" y="204" width="12" height="12" rx="2" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<rect x="400" y="219" width="12" height="12" rx="2" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<line x1="412" y1="210" x2="428" y2="210" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<polygon points="430,210 480,173 480,247" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<line x1="480" y1="210" x2="493" y2="210" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="495" y="192" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>

<!-- Row 3: SAR -->
<text x="40" y="315" font-size="14" font-weight="500" fill="#2C2C2A">SAR</text>
<rect x="95" y="292" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<polygon points="140,273 140,347 190,310" fill="#85B7EB" stroke="#0C447C" stroke-width="0.5"/>
<rect x="200" y="289" width="12" height="12" rx="2" fill="#85B7EB" stroke="#0C447C" stroke-width="0.5"/>
<rect x="200" y="304" width="12" height="12" rx="2" fill="#2C2C2A" stroke="#0C447C" stroke-width="0.5"/>
<rect x="200" y="319" width="12" height="12" rx="2" fill="#85B7EB" stroke="#0C447C" stroke-width="0.5"/>
<line x1="212" y1="310" x2="275" y2="310" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="365" y1="310" x2="400" y2="310" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="400" y="289" width="12" height="12" rx="2" fill="#85B7EB" stroke="#0C447C" stroke-width="0.5"/>
<rect x="400" y="304" width="12" height="12" rx="2" fill="#85B7EB" stroke="#0C447C" stroke-width="0.5"/>
<rect x="400" y="319" width="12" height="12" rx="2" fill="#85B7EB" stroke="#0C447C" stroke-width="0.5"/>
<line x1="412" y1="310" x2="428" y2="310" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<polygon points="430,310 480,273 480,347" fill="#85B7EB" stroke="#0C447C" stroke-width="0.5"/>
<line x1="480" y1="310" x2="493" y2="310" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="495" y="292" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>

<!-- Row 4: Text -->
<text x="40" y="415" font-size="14" font-weight="500" fill="#2C2C2A">Text</text>
<rect x="95" y="392" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<polygon points="140,373 140,447 190,410" fill="#F4C0D1" stroke="#993556" stroke-width="0.5"/>
<rect x="200" y="389" width="12" height="12" rx="2" fill="#F4C0D1" stroke="#993556" stroke-width="0.5"/>
<rect x="200" y="404" width="12" height="12" rx="2" fill="#F4C0D1" stroke="#993556" stroke-width="0.5"/>
<rect x="200" y="419" width="12" height="12" rx="2" fill="#F4C0D1" stroke="#993556" stroke-width="0.5"/>
<line x1="212" y1="410" x2="275" y2="410" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="365" y1="410" x2="405" y2="410" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="410" y="375" width="180" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="500" y="398" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Shared decoder</text>
<text x="500" y="417" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Caption + VQA</text>

<!-- fusion module, spans all rows -->
<rect x="280" y="65" width="85" height="390" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="322" y="260" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Fusion</text>

<!-- side loss: contrastive -->
<line x1="222" y1="65" x2="222" y2="455" stroke="#A32D2D" stroke-width="1"/>
<text x="222" y="472" text-anchor="middle" font-size="12" fill="#791F1F">L contrastive</text>

<!-- gen loss -->
<line x1="500" y1="445" x2="500" y2="463" stroke="#A32D2D" stroke-width="1" marker-end="url(#arrow-red)"/>
<text x="500" y="478" text-anchor="middle" font-size="12" fill="#791F1F">L gen</text>

